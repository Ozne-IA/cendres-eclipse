name: Verify Chromium journeys and canvas

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --only-shell --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Journeys and renderer screenshots
        run: npm run test:e2e
      - name: Keep failure traces and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-failure-results
          path: test-results/
