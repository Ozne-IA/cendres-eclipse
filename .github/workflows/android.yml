name: Verify Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - run: npm ci
      - run: npm run build
      - name: Build and verify preview APK
        run: |
          gradle -p android :app:assembleDebug
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -p "$APK" assets/index.html | cmp - dist/index.html
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-info.txt
          grep -F "package: name='com.ozneia.cendreseclipse.fluidite'" apk-info.txt
          cp "$APK" Cendres-Eclipse-Android-preview.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-preview
          path: Cendres-Eclipse-Android-preview.apk
          if-no-files-found: error
