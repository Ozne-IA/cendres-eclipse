name: Publish a game version

# Se déclenche quand on pousse une étiquette de version, par exemple v1.1.0.
# 1. build : teste, compile, prépare les fichiers de mise à jour et le zip complet pour les nouveaux joueurs.
# 2. verify : décompresse le zip réellement distribué sous Windows et Linux (chemin avec accents et espace),
#    vérifie les fichiers, démarre le jeu, écrit puis relit une sauvegarde après relance.
# 3. publish : seulement si tout est vert, crée la release (zip, manifeste et fichiers nommés par empreinte).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check that package.json matches the tag
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Prepare the update files
        run: node scripts/make-release.mjs --version "${GITHUB_REF_NAME#v}" --out release
      - name: Build the full package for new players
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="Cendres-Eclipse-${VERSION}"
          node scripts/build-package.mjs --out "package/${NAME}"
          (cd package && zip -qr "../${NAME}.zip" "${NAME}")
      - name: Keep the update files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/
          if-no-files-found: error
      - name: Keep the full package
        uses: actions/upload-artifact@v7
        with:
          name: game-zip
          path: Cendres-Eclipse-*.zip
          if-no-files-found: error

  verify:
    name: verify the zip (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download the full package
        uses: actions/download-artifact@v8
        with:
          name: game-zip
          path: zip
      - name: Unzip into a path with accents and a space
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${RUNNER_TEMP}/Cendres éclipse installé"
          mkdir -p "$TARGET"
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath 'zip/Cendres-Eclipse-${VERSION}.zip' -DestinationPath '${TARGET}' -Force"
          else
            unzip -q "zip/Cendres-Eclipse-${VERSION}.zip" -d "$TARGET"
          fi
          echo "PACKAGE_DIR=${TARGET}/Cendres-Eclipse-${VERSION}" >> "$GITHUB_ENV"
      - name: Verify the package like a player would
        run: node scripts/verify-package.mjs "$PACKAGE_DIR" --version "${GITHUB_REF_NAME#v}"

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the update files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release
      - name: Download the full package
        uses: actions/download-artifact@v8
        with:
          name: game-zip
          path: zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Guide de téléchargement en tête, puis les notes générées par GitHub.
          cat > guide.md <<'GUIDE_EOF'
          ## Quel fichier télécharger ?

          - **Première installation** : `Cendres-Eclipse-__VERSION__.zip`. C'est le seul fichier à télécharger à la main. Décompressez-le, puis lancez le jeu depuis le dossier décompressé.
          - **Mise à jour** : pas besoin de télécharger quoi que ce soit. Le lanceur récupère automatiquement les fichiers nécessaires.

          Les autres fichiers, dont le nom est une longue suite de chiffres et de lettres (une empreinte SHA-256), et `update-manifest.json` servent au lanceur pour les mises à jour. Ne les téléchargez pas à la main et ne les renommez pas : le lanceur les retrouve grâce à leur nom.

          GUIDE_EOF
          sed -i "s/__VERSION__/${VERSION}/" guide.md
          gh api "repos/${GH_REPO}/releases/generate-notes" -f tag_name="${GITHUB_REF_NAME}" --jq .body > generated.md
          cat guide.md generated.md > notes.md
          gh release create "${GITHUB_REF_NAME}" release/* "zip/Cendres-Eclipse-${VERSION}.zip" \
            --title "Cendres de l'Éclipse ${VERSION}" \
            --notes-file notes.md

  publish-android:
    if: vars.ANDROID_RELEASE_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - run: npm ci
      - run: npm run build
      - name: Sign and verify Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          export ANDROID_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/cendres-signing.XXXXXX")"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          gradle -p android :app:assembleRelease
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          cp "$APK" Cendres-Eclipse-Android.apk
      - name: Attach Android APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Cendres-Eclipse-Android.apk
