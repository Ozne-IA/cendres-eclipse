name: Publish a game version

# Se déclenche quand on pousse une étiquette de version, par exemple v1.1.0.
# Publie sur GitHub : le jeu à télécharger en entier (une seule fois par joueur), le manifeste des mises à jour
# et chaque fichier du jeu nommé d'après son empreinte, pour que les joueurs ne téléchargent que ce qui a changé.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Prepare the update files
        run: node scripts/make-release.mjs --version "${GITHUB_REF_NAME#v}" --out release
      - name: Build the full package for new players
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="Cendres-Eclipse-${VERSION}"
          mkdir -p "package/${NAME}/launcher"
          cp -r dist "package/${NAME}/dist"
          cp launcher/*.mjs "package/${NAME}/launcher/"
          cp scripts/release/Lancer_Cendres_Eclipse.bat scripts/release/Lancer_Cendres_Eclipse.sh scripts/release/LISEZMOI.txt "package/${NAME}/"
          # Fins de ligne Windows pour le .bat et le texte
          sed -i 's/$/\r/' "package/${NAME}/Lancer_Cendres_Eclipse.bat" "package/${NAME}/LISEZMOI.txt"
          chmod +x "package/${NAME}/Lancer_Cendres_Eclipse.sh"
          (cd package && zip -qr "../${NAME}.zip" "${NAME}")
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" release/* "Cendres-Eclipse-${VERSION}.zip" \
            --title "Cendres de l'Éclipse ${VERSION}" \
            --generate-notes
