name: Verify game

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Launcher syntax
        run: node --check launcher/server-pc.mjs

  # Le paquet que recevront les joueurs est assemblé et essayé sous Windows et Linux à chaque modification,
  # dans un chemin avec accents et espace : on n'attend plus la publication pour découvrir un problème.
  package-smoke-test:
    name: package smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Launcher, save and update tests on this system
        run: node --import tsx --test test/*.test.mjs
      - name: Production build
        run: npm run build
      - name: Prepare the update files (test version)
        run: node scripts/make-release.mjs --version 0.0.0 --out "${RUNNER_TEMP}/release-test"
      - name: Build the package in a path with accents and a space
        run: node scripts/build-package.mjs --out "${RUNNER_TEMP}/Cendres éclipse paquet/Cendres-Eclipse-test"
      - name: Verify the package like a player would
        run: node scripts/verify-package.mjs "${RUNNER_TEMP}/Cendres éclipse paquet/Cendres-Eclipse-test" --version 0.0.0
